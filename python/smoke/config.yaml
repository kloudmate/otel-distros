# The shape km-agent generates (contract §1), trimmed for the smoke test. Exporters carry no endpoint:
# the distro fills it from distribution.kloudmate.agent.
file_format: "1.0"
resource:
  attributes:
    - name: service.name
      value: ${OTEL_SERVICE_NAME:-smoke-file}
propagator:
  composite:
    - tracecontext:
    - baggage:
tracer_provider:
  processors:
    - batch:
        schedule_delay: 200
        exporter:
          otlp_http: {}
meter_provider:
  readers:
    - periodic:
        interval: 1000
        exporter:
          otlp_http: {}
logger_provider:
  processors:
    - batch:
        exporter:
          otlp_http: {}
distribution:
  kloudmate:
    service_id: "systemd:smoke-file.service"
    agent:
      otlp_socket: /nonexistent/otlp.sock
      otlp_endpoint: http://127.0.0.1:${SMOKE_FILE_PORT:-4318}
    runtime_metrics: { profile: standard }
    status_dir: ${KM_SDK_STATUS_DIR}
    some_future_key: ignored
